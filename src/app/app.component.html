<div class="container">
<app-header />
<router-outlet></router-outlet>
<app-alert #globalAlert
    [message]="alertMessage"
    [type]="alertType"
    [autoDismiss]="false"
    vertical="top"
    horizontal="center"
/>
</div>

@if(showModalUpdate){
    <modal 
    [message]="'Uma nova versão do Diário está disponível.\n deseja instalar?'"
    [title]="'Atualização'"
    btnOkText="'Atualizar'"
    (onOk)="pwaService.update()"
    (onCancel)="showModalUpdate = false"/>
}
