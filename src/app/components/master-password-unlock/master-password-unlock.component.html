<form [formGroup]="form" (ngSubmit)="confirm()">
  <div class="mb-3">
    <label for="unlockMasterPassword" class="form-label">Senha mestra</label>
    <input
      id="unlockMasterPassword"
      type="password"
      class="form-control"
      formControlName="masterPassword"
      autocomplete="current-password">

    @if (masterPassword?.touched && masterPassword?.hasError('required')) {
      <div class="text-danger mt-1">Informe a senha mestra.</div>
    }
  </div>

  @if (errorMessage) {
    <div class="alert alert-danger">
      {{ errorMessage }}
    </div>
  }

  <button type="submit" class="btn btn-primary">
    Desbloquear cofre
  </button>
</form>
